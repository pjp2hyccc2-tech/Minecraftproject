name: ETERNAL REALM build

# Compile + unit tests + headless Minecraft server boot with GameTests.
# This is the automated part of the "完了条件": the mod must load on a dedicated-type server without errors.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The wrapper downloads Gradle from services.gradle.org, which redirects to GitHub release assets; when those
      # time out (504), install the same Gradle 8.8 from mirrors instead, verified against the official checksum.
      - name: Install Gradle 8.8 (mirrors, checksum verified)
        run: |
          GRADLE_VERSION=8.8
          SHA256=a4b4158601f8636cdeeab09bd76afb640030bb5b144aafe261a5e8af027dc612
          DEST="$HOME/gradle-dist"
          mkdir -p "$DEST"
          for url in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$GRADLE_VERSION-bin.zip" \
            "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-$GRADLE_VERSION-bin.zip"; do
            for attempt in 1 2 3; do
              echo "Trying $url (attempt $attempt)"
              if curl -fsSL --connect-timeout 20 --max-time 300 -o "$DEST/gradle.zip" "$url" \
                  && echo "$SHA256  $DEST/gradle.zip" | sha256sum -c -; then
                unzip -q "$DEST/gradle.zip" -d "$DEST"
                echo "$DEST/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
                exit 0
              fi
              sleep 10
            done
          done
          echo "Could not download Gradle $GRADLE_VERSION from any mirror"
          exit 1

      - name: Compile, unit tests and mod jar
        run: gradle build --no-daemon --stacktrace

      # Development sandboxes that can read job logs but cannot download artifacts take the jar from here.
      # Verify with the printed SHA-256 after decoding.
      - name: Export mod jar into the log
        run: |
          JAR=$(ls build/libs/eternalrealm-*.jar | grep -v -- '-sources' | head -1)
          echo "ER_JAR_NAME=$(basename "$JAR")"
          echo "ER_JAR_SHA256=$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "----- BEGIN ER JAR BASE64 -----"
          base64 -w 120 "$JAR"
          echo "----- END ER JAR BASE64 -----"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: eternalrealm-jar
          path: build/libs/*.jar

      - name: Boot a GameTest server with the mod and run all GameTests
        run: gradle runGameTestServer --no-daemon --stacktrace

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-and-logs
          path: |
            build/reports/
            build/test-results/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
