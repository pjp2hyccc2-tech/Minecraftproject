name: BirdieCraft in-game self-test

on:
  push:
    branches: [ birdiecraft ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare run directory
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nview-distance=8\nsimulation-distance=6\nspawn-monsters=false\n' > run/server.properties
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nrenderDistance:8\nsimulationDistance:6\nguiScale:2\nsoundCategory_master:0.0\n' > run/options.txt

      - name: Server self-test (build a preset course, play a CPU match)
        run: |
          BIRDIE_SELFTEST=server timeout 1800 ./gradlew runServer --no-daemon > server.log 2>&1 || true
          grep -E "\[SelfTest\]|Exception|ERROR|Caused by" server.log | head -300
          grep -q "SELFTEST PASS" server.log

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null

      - name: Client self-test (play with screenshots)
        run: |
          mkdir -p run/saves
          cp -r run/world run/saves/selftest
          rm -f run/saves/selftest/session.lock
          export LIBGL_ALWAYS_SOFTWARE=1
          BIRDIE_SELFTEST=client timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
          grep -E "ClientSelfTest|Exception|ERROR|Caused by|crash" client.log | head -300
          grep -q "CLIENT SELFTEST DONE" client.log

      - name: Publish results to the birdiecraft-selftest branch
        if: always()
        run: |
          mkdir -p /tmp/out
          for f in server.log client.log; do
            if [ -f "$f" ]; then
              grep -E "SelfTest|ClientSelfTest|Exception|ERROR|WARN.*birdiecraft|Caused by|\tat " "$f" | head -4000 > "/tmp/out/${f%.log}-filtered.log" || true
              tail -n 1500 "$f" > "/tmp/out/${f%.log}-tail.log"
            fi
          done
          cp run/selftest-screens/*.png /tmp/out/ 2>/dev/null || true
          cp -r run/crash-reports /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q
          git checkout -q -b birdiecraft-selftest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test results for $GITHUB_SHA" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" birdiecraft-selftest
