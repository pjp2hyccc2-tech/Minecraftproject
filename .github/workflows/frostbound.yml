name: FROSTBOUND build

on:
  push:
    branches: [frostbound]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frostbound-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod and run unit tests
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dedicated server boot self-test
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('ci/selftest.enabled') != ''
        continue-on-error: true
        env:
          FROSTBOUND_SELFTEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cp ci/server.properties run/server.properties
          set -o pipefail
          timeout 900 ./gradlew runServer --no-daemon 2>&1 | tee selftest.log
          test -f run/frostbound-selftest.json
          grep -q '"result": "pass"' run/frostbound-selftest.json

      - name: Publish results to frostbound-ci branch
        if: always()
        run: |
          mkdir -p out/test-results
          cp build.log out/ 2>/dev/null || true
          grep -E "error:|warning: \[|FAILED|BUILD" build.log > out/build-errors.txt 2>/dev/null || true
          cp selftest.log out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cp core/build/test-results/test/*.xml out/test-results/ 2>/dev/null || true
          cp run/frostbound-selftest.json out/ 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp -r run/crash-reports out/ 2>/dev/null || true
          cat > out/summary.json <<JSON
          {"sha": "${GITHUB_SHA}", "run": "${GITHUB_RUN_NUMBER}", "build": "${{ steps.build.outcome }}", "selftest": "${{ steps.selftest.outcome }}"}
          JSON
          cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b frostbound-ci
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}) build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" frostbound-ci

      - name: Fail if build or self-test failed
        if: steps.build.outcome != 'success' || steps.selftest.outcome == 'failure'
        run: exit 1
