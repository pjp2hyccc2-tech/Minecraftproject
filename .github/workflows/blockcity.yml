name: BLOCK CITY build

on:
  push:
    branches: [blockcity]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blockcity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build mod (compile + reobf jar)
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dedicated server self-test
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('ci/selftest.enabled') != ''
        continue-on-error: true
        env:
          BLOCKCITY_SELFTEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cp ci/server.properties run/server.properties
          set -o pipefail
          timeout 1500 ./gradlew runServer --no-daemon 2>&1 | tee selftest.log
          test -f run/blockcity-selftest.json
          grep -q '"result": "pass"' run/blockcity-selftest.json

      - name: Client screenshot tour (Xvfb + Mesa)
        id: shots
        if: steps.build.outcome == 'success' && hashFiles('ci/shots.enabled') != ''
        continue-on-error: true
        env:
          BLOCKCITY_SHOTS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          ALSOFT_DRIVERS: 'null'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 imagemagick > /dev/null
          rm -rf run/world run/saves
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client.log

      - name: Publish results to blockcity-ci branch
        if: always()
        run: |
          mkdir -p out/screenshots
          cp build.log out/ 2>/dev/null || true
          grep -nE "error:|warning: \[removal\]|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 build.log > out/build-errors.txt 2>/dev/null || true
          cp selftest.log out/ 2>/dev/null || true
          tail -n 400 client.log > out/client-tail.log 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cp run/blockcity-selftest.json out/ 2>/dev/null || true
          cp run/blockcity-shots.json out/ 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp -r run/crash-reports out/ 2>/dev/null || true
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            b=$(basename "$f" .png)
            convert "$f" -resize 1280x720 -quality 86 "out/screenshots/$b.jpg" 2>/dev/null || cp "$f" out/screenshots/
          done
          cat > out/summary.json <<JSON
          {"sha": "${GITHUB_SHA}", "run": "${GITHUB_RUN_NUMBER}", "build": "${{ steps.build.outcome }}", "selftest": "${{ steps.selftest.outcome }}", "shots": "${{ steps.shots.outcome }}"}
          JSON
          cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b blockcity-ci
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}) build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }} shots=${{ steps.shots.outcome }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" blockcity-ci

      - name: Fail if build or self-test failed
        if: steps.build.outcome != 'success' || steps.selftest.outcome == 'failure'
        run: exit 1
