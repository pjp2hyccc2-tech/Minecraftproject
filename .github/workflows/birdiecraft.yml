name: BirdieCraft build

on:
  push:
    branches: [ birdiecraft ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: birdiecraft-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar to the birdiecraft-dist branch
        run: |
          mkdir -p /tmp/dist
          cp build/libs/*.jar /tmp/dist/
          cd /tmp/dist
          git init -q
          git checkout -q -b birdiecraft-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# BirdieCraft jar\n\nBuilt from commit %s of the birdiecraft branch.\nPut the jar into .minecraft/mods (Forge 1.20.1).\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "BirdieCraft jar built from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" birdiecraft-dist
