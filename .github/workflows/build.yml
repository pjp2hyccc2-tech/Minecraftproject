name: REISATSU build

on:
  push:
    branches: [ reisatsu, 'rs-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------------------------
  # Build + dedicated-server self test + vanilla client screenshot tour (Xvfb + Mesa llvmpipe)
  # Results: branch ci-<branch>
  # -------------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Server self-test
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('ci/selftest.enabled') != ''
        continue-on-error: true
        env:
          REISATSU_SELFTEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cp ci/server.properties run/server.properties
          set -o pipefail
          timeout 1500 ./gradlew runServer --no-daemon 2>&1 | tee selftest.log || true
          cat run/reisatsu-selftest.txt
          grep -q "SELFTEST RESULT: PASS" run/reisatsu-selftest.txt

      - name: Client screenshot tour
        id: shots
        if: steps.build.outcome == 'success' && hashFiles('ci/shots.enabled') != ''
        continue-on-error: true
        env:
          REISATSU_SHOTS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p run
          cp ci/options.txt run/options.txt
          rm -rf run/screenshots run/saves/ReisatsuCI*
          set -o pipefail
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client.log || true
          cat run/reisatsu_autoshots.txt
          grep -q finished run/reisatsu_autoshots.txt

      - name: Publish results
        if: always()
        run: |
          mkdir -p out/screenshots
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "build=${{ steps.build.outcome }} selftest=${{ steps.selftest.outcome }} shots=${{ steps.shots.outcome }}" > out/STATUS
          cp build.log out/ 2>/dev/null || true
          grep -E "\.java:[0-9]+: (error|warning)" -A3 build.log > out/errors.txt 2>/dev/null || true
          tail -c 300000 selftest.log > out/selftest.log 2>/dev/null || true
          tail -c 300000 client.log > out/client.log 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/reisatsu-selftest.txt run/reisatsu_autoshots.txt run/reisatsu-layout.txt out/ 2>/dev/null || true
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cp build/shaderpack/*.zip out/ 2>/dev/null || true
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "reisatsu-ci"
          git config user.email "reisatsu-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reisatsu-jar
          path: |
            build/libs/*.jar
            build/shaderpack/*.zip

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  # -------------------------------------------------------------------------------------------
  # ReisatsuShaders: GLSL lint + client tour with Oculus + Embeddium + the bundled pack.
  # Results: branch ci-<branch>-shaders
  # -------------------------------------------------------------------------------------------
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: GLSL lint
        id: lint
        if: hashFiles('ci/shaders.enabled') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          set -o pipefail
          if [ -f tools/shader/lint.py ]; then python3 tools/shader/lint.py 2>&1 | tee lint.txt; else echo "no lint tool" | tee lint.txt; fi

      - name: Shader client tour (Oculus + Embeddium + ReisatsuShaders)
        id: shaderrun
        if: hashFiles('ci/shaders.enabled') != ''
        continue-on-error: true
        env:
          REISATSU_SHOTS: 'true'
          REISATSU_OCULUS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          chmod +x ./gradlew
          mkdir -p run/shaderpacks run/config
          cp ci/options.txt run/options.txt
          (cd src/main/shaderpack && zip -qr ../../../run/shaderpacks/ReisatsuShaders.zip shaders)
          printf 'enableShaders=true\nshaderPack=ReisatsuShaders.zip\n' > run/config/oculus.properties
          cp run/config/oculus.properties run/config/iris.properties
          set -o pipefail
          timeout 3000 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee shaders.log || true
          cat run/reisatsu_autoshots.txt
          grep -q finished run/reisatsu_autoshots.txt

      - name: Publish shader results
        if: always()
        run: |
          mkdir -p out/screenshots
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "lint=${{ steps.lint.outcome }} shaderrun=${{ steps.shaderrun.outcome }}" > out/STATUS
          cp lint.txt out/ 2>/dev/null || true
          tail -c 400000 shaders.log > out/shaders.log 2>/dev/null || true
          cp run/logs/latest.log out/shaders-latest.log 2>/dev/null || true
          grep -n -i -E "oculus|iris|shader|glsl|reisatsu|Exception|error" run/logs/latest.log | grep -v -i "mixin" > out/shaders-grep.txt 2>/dev/null || true
          cp run/reisatsu_autoshots.txt out/ 2>/dev/null || true
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          ls run/mods > out/mods.txt 2>/dev/null || true
          if [ -d run/patched_shaders ]; then tar czf out/patched_shaders.tgz -C run patched_shaders; fi
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}-shaders"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "reisatsu-ci"
          git config user.email "reisatsu-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Shader CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"

  # -------------------------------------------------------------------------------------------
  # Trailer footage: the scripted capture (com.reisatsu.client.cine.Trailer) with Oculus + ReisatsuShaders,
  # 1920x804, 30 fps, one H.264 clip per shot. Toggles: ci/trailer.enabled, ci/trailer.preview (3 key
  # frames per shot as JPEG), ci/trailer.only (comma separated shot names).
  # Results: branch ci-<branch>-trailer
  # -------------------------------------------------------------------------------------------
  trailer:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: hashFiles('ci/trailer.enabled') != ''
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('ci/trailer.enabled') != ''

      - name: Film the trailer
        id: film
        if: hashFiles('ci/trailer.enabled') != ''
        continue-on-error: true
        env:
          REISATSU_TRAILER: 'true'
          REISATSU_OCULUS: 'true'
          REISATSU_SEED: '20261102'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 ffmpeg zip > /dev/null
          chmod +x ./gradlew
          mkdir -p run/shaderpacks run/config
          cp ci/options.txt run/options.txt
          (cd src/main/shaderpack && zip -qr ../../../run/shaderpacks/ReisatsuShaders.zip shaders)
          printf 'enableShaders=true\nshaderPack=ReisatsuShaders.zip\n' > run/config/oculus.properties
          cp run/config/oculus.properties run/config/iris.properties
          # clean frames: film grain is added in the edit
          printf 'FILM_GRAIN=0.0\n' > run/shaderpacks/ReisatsuShaders.zip.txt
          rm -rf run/trailer run/trailer_preview run/saves/ReisatsuTrailer*
          export REISATSU_TRAILER_PREVIEW=false
          [ -f ci/trailer.preview ] && export REISATSU_TRAILER_PREVIEW=true
          export REISATSU_TRAILER_ONLY=all
          [ -s ci/trailer.only ] && export REISATSU_TRAILER_ONLY="$(tr -d ' \n' < ci/trailer.only)"
          echo "preview=$REISATSU_TRAILER_PREVIEW only=$REISATSU_TRAILER_ONLY"
          set -o pipefail
          timeout 13000 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient --no-daemon 2>&1 | tee trailer.log || true
          cat run/reisatsu_trailer.txt
          grep -q finished run/reisatsu_trailer.txt

      - name: Encode clips
        if: always() && hashFiles('ci/trailer.enabled') != ''
        run: |
          mkdir -p out/trailer out/preview
          for d in run/trailer/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            ffmpeg -hide_banner -loglevel error -framerate 30 -i "$d/%05d.png" -c:v libx264 -preset slow -crf 15 \
              -pix_fmt yuv420p -movflags +faststart "out/trailer/$n.tmp.mp4" && mv "out/trailer/$n.tmp.mp4" "out/trailer/$n.mp4"
            echo "$n: $(ls "$d" | wc -l) frames, $(du -h "out/trailer/$n.mp4" | cut -f1)"
          done
          for f in run/trailer_preview/*.png; do
            [ -f "$f" ] || continue
            ffmpeg -hide_banner -loglevel error -i "$f" -q:v 3 "out/preview/$(basename "${f%.png}").jpg"
          done

      - name: Publish trailer results
        if: always() && hashFiles('ci/trailer.enabled') != ''
        run: |
          mkdir -p out
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "film=${{ steps.film.outcome }}" > out/STATUS
          tail -c 400000 trailer.log > out/trailer.log 2>/dev/null || true
          cp run/logs/latest.log out/trailer-latest.log 2>/dev/null || true
          grep -n -i -E "oculus|iris|reisatsu|Exception|error" run/logs/latest.log | grep -v -i "mixin" > out/trailer-grep.txt 2>/dev/null || true
          cp run/reisatsu_trailer.txt out/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}-trailer"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "reisatsu-ci"
          git config user.email "reisatsu-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Trailer CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"
