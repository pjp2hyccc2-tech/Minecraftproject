name: Build Clockwork Diver

on:
  push:
    branches-ignore:
      - ci-results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Server self test
        id: selftest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\n" > run/server.properties
          timeout 1500 ./gradlew runServer -Pselftest=true --no-daemon 2>&1 | tee selftest.log || true
          cp run/logs/latest.log server-latest.log || true
          cat run/selftest-report.txt
          grep -q "SELFTEST RESULT: PASS" run/selftest-report.txt

      - name: Client screenshot test
        id: clienttest
        if: steps.build.outcome == 'success' && hashFiles('ci/client-test.sh') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          bash ci/client-test.sh 2>&1 | tee clienttest.log

      - name: Publish results to ci-results branch
        if: always()
        run: |
          mkdir -p /tmp/results/screens
          cp build.log clienttest.log clienttest-tail.log server-latest.log client-latest.log /tmp/results/ 2>/dev/null || true
          tail -c 300000 selftest.log > /tmp/results/selftest.log 2>/dev/null || true
          grep -E "\.java:[0-9]+: error" -A3 build.log > /tmp/results/compile-errors.txt 2>/dev/null || true
          cp build/libs/*.jar /tmp/results/ 2>/dev/null || true
          cp run/selftest-report.txt run/clockworkdiver_autoshots.txt /tmp/results/ 2>/dev/null || true
          cp run/screenshots/*.png /tmp/results/screens/ 2>/dev/null || true
          cp run/crash-reports/*.txt /tmp/results/ 2>/dev/null || true
          echo "sha=${GITHUB_SHA}" > /tmp/results/status.txt
          echo "build=${{ steps.build.outcome }}" >> /tmp/results/status.txt
          echo "selftest=${{ steps.selftest.outcome }}" >> /tmp/results/status.txt
          echo "clienttest=${{ steps.clienttest.outcome }}" >> /tmp/results/status.txt
          cd /tmp/results
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -q -b ci-results
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: clockworkdiver-jar
          path: build/libs/*.jar

      - name: Fail if build or a test failed
        if: steps.build.outcome != 'success' || steps.selftest.outcome == 'failure' || steps.clienttest.outcome == 'failure'
        run: exit 1
