name: HuntCraft Build

on:
  push:
    branches: [ huntcraft, 'hc-*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: GameTest server
        id: gametest
        if: steps.build.outcome == 'success' && hashFiles('ci/run-gametest') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 1200 ./gradlew runGameTestServer 2>&1 | tee gametest.log

      - name: Client autotest (screenshots)
        id: client
        if: steps.build.outcome == 'success' && hashFiles('ci/run-client') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PhcAutotest 2>&1 | tee client.log

      - name: Publish results to huntcraft-ci branch
        if: always()
        run: |
          mkdir -p out
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }} client=${{ steps.client.outcome }}" > out/STATUS
          cp build.log out/ 2>/dev/null || true
          grep -E "error:|\.java:[0-9]+: (error|warning)" -A3 build.log > out/errors.txt 2>/dev/null || true
          tail -c 200000 gametest.log > out/gametest.log 2>/dev/null || true
          tail -c 300000 client.log > out/client.log 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/logs/debug.log out/run-debug.log 2>/dev/null || true
          mkdir -p out/screenshots
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/huntcraft_autotest/*.png out/screenshots/ 2>/dev/null || true
          cp run/huntcraft_autotest/*.txt out/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cp build/shaderpack/*.zip out/ 2>/dev/null || true
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "huntcraft-ci"
          git config user.email "huntcraft-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"

  # -------------------------------------------------------------------------------------------
  # HuntCraft Shaders: GLSL lint + client run with Embeddium + Oculus + the bundled shader pack
  # (Xvfb + Mesa llvmpipe). Independent of the main job; results go to branch ci-<branch>-shaders.
  # -------------------------------------------------------------------------------------------
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: GLSL lint (glslangValidator)
        id: lint
        if: hashFiles('ci/run-shaders') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          python3 tools/shader/build_pack.py
          git diff --stat --exit-code -- src/main/shaderpack || echo "WARNING: generated stubs differ from the committed ones"
          set -o pipefail
          python3 tools/shader/lint.py 2>&1 | tee lint.txt

      - name: Shader client run (Embeddium + Oculus, screenshots)
        id: shaderrun
        if: hashFiles('ci/run-shaders') != ''
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          export MESA_GLSL_VERSION_OVERRIDE=450
          export GALLIUM_DRIVER=llvmpipe
          mkdir -p run-shaders/config
          cp ci/options.txt run-shaders/options.txt || true
          printf 'enableDebugOptions=true\n' > run-shaders/config/oculus.properties
          chmod +x gradlew
          ./gradlew prepareShaderRun --info 2>&1 | grep -i -E "modrinth|cursemaven|curse.maven|embeddium|oculus|deobf|mod_remap|FAIL|wrong" | head -40 || true
          ls -la run-shaders/mods || true
          set -o pipefail
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientShaders --stacktrace 2>&1 | tee shaders.log

      - name: Publish shader results
        if: always()
        run: |
          mkdir -p out/screenshots
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "lint=${{ steps.lint.outcome }} shaderrun=${{ steps.shaderrun.outcome }}" > out/STATUS
          cp lint.txt out/ 2>/dev/null || true
          tail -c 400000 shaders.log > out/shaders.log 2>/dev/null || true
          cp run-shaders/logs/latest.log out/shaders-latest.log 2>/dev/null || true
          grep -n -i -E "oculus|iris|shader|glsl|\[SHADERTEST\]|HuntCraft Shaders|Exception|error" run-shaders/logs/latest.log > out/shaders-grep.txt 2>/dev/null || true
          cp run-shaders/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run-shaders/huntcraft_autotest/*.txt out/ 2>/dev/null || true
          cp run-shaders/crash-reports/*.txt out/ 2>/dev/null || true
          ls run-shaders/mods > out/mods.txt 2>/dev/null || true
          mkdir -p out/thirdparty && find ~/.gradle/caches/modules-2/files-2.1/curse.maven -name '*.jar' -not -name '*sources*' -exec cp {} out/thirdparty/ \; 2>/dev/null || true
          ls run-shaders/shaderpacks > out/shaderpacks.txt 2>/dev/null || true
          if [ -d run-shaders/patched_shaders ]; then tar czf out/patched_shaders.tgz -C run-shaders patched_shaders; fi
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}-shaders"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "huntcraft-ci"
          git config user.email "huntcraft-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Shader CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"
