name: build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Server self-test
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('ci/selftest.enabled') != ''
        continue-on-error: true
        env:
          TABI_SELFTEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cp ci/server.properties run/server.properties
          set -o pipefail
          timeout 1500 ./gradlew runServer --no-daemon 2>&1 | tee selftest.log

      - name: Client screenshot tour
        id: shots
        if: steps.build.outcome == 'success' && hashFiles('ci/shots.enabled') != ''
        continue-on-error: true
        env:
          TABI_SHOTS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client.log

      - name: Client shaderpack tour (Oculus + Embeddium + TabiShaders)
        id: shaders
        if: steps.build.outcome == 'success' && hashFiles('ci/shaders.enabled') != ''
        continue-on-error: true
        env:
          TABI_SHOTS: 'true'
          TABI_OCULUS: 'true'
          TABI_SHOTS_WAITMUL: '3'
          TABI_SHOTS_ONLY: 'village_morning,engawa_evening,village_kura,okawa_station,kirigaya,shiomi_bridge,shiomi_crossing,akashi_bridge_night,port_tower_night,kobe_overview_dusk,venus_dusk,venus_night,kobe_junction_night,meriken_day,train_ride'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          mkdir -p run/shaderpacks run/config
          if [ -d run/screenshots ]; then mv run/screenshots run/screenshots_vanilla; fi
          (cd shaderpack/TabiShaders && zip -qr ../../run/shaderpacks/TabiShaders.zip shaders)
          printf 'shadowMapResolution=1024\n' > run/shaderpacks/TabiShaders.zip.txt
          printf 'enableShaders=true\nshaderPack=TabiShaders.zip\n' > run/config/oculus.properties
          cp run/config/oculus.properties run/config/iris.properties
          set -o pipefail
          rc=0
          timeout 2700 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client_shaders.log || rc=$?
          mkdir -p run/screenshots_shaders
          mv run/screenshots/*.png run/screenshots_shaders/ 2>/dev/null || true
          cp run/logs/latest.log run/shaders-latest.log 2>/dev/null || true
          if [ -d run/screenshots_vanilla ]; then rm -rf run/screenshots; mv run/screenshots_vanilla run/screenshots; fi
          ls run/screenshots_shaders | head -40
          exit $rc

      - name: Publish results to tabi-ci branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp selftest.log out/ 2>/dev/null || true
          cp client.log out/ 2>/dev/null || true
          cp client_shaders.log out/ 2>/dev/null || true
          cp run/shaders-latest.log out/ 2>/dev/null || true
          mkdir -p out/screenshots_shaders
          cp run/screenshots_shaders/*.png out/screenshots_shaders/ 2>/dev/null || true
          (cd shaderpack/TabiShaders && zip -qr ../../out/TabiShaders.zip shaders) || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          mkdir -p out/screenshots
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/tabi-selftest.json out/ 2>/dev/null || true
          cp -r run/crash-reports out/ 2>/dev/null || true
          cat > out/summary.json <<EOF
          {"sha": "${GITHUB_SHA}", "run": "${GITHUB_RUN_NUMBER}", "build": "${{ steps.build.outcome }}", "selftest": "${{ steps.selftest.outcome }}", "shots": "${{ steps.shots.outcome }}", "shaders": "${{ steps.shaders.outcome }}"}
          EOF
          cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b tabi-ci
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" tabi-ci

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
