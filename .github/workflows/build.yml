name: MINECRAFT BESIEGE build

on:
  push:
    branches: [mcbesiege]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Server self-test
        id: selftest
        if: steps.build.outcome == 'success' && hashFiles('ci/selftest.enabled') != ''
        continue-on-error: true
        env:
          MCB_SELFTEST: 'true'
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          cp ci/server.properties run/server.properties
          set -o pipefail
          timeout 1500 ./gradlew runServer --no-daemon 2>&1 | tee selftest.log

      - name: Client screenshot tour
        id: shots
        if: steps.build.outcome == 'success' && hashFiles('ci/shots.enabled') != ''
        continue-on-error: true
        env:
          MCB_SHOTS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client.log

      - name: Publish results to mcbesiege-ci branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          grep -E "error:|warning: \[|FAILED|BUILD" build.log > out/build-errors.txt 2>/dev/null || true
          cp selftest.log out/ 2>/dev/null || true
          cp client.log out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          mkdir -p out/screenshots
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/mcbesiege-selftest.json out/ 2>/dev/null || true
          cp -r run/crash-reports out/ 2>/dev/null || true
          cat > out/summary.json <<JSON
          {"sha": "${GITHUB_SHA}", "run": "${GITHUB_RUN_NUMBER}", "build": "${{ steps.build.outcome }}", "selftest": "${{ steps.selftest.outcome }}", "shots": "${{ steps.shots.outcome }}"}
          JSON
          cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b mcbesiege-ci
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" mcbesiege-ci

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
