name: Build Satsujinki mod

on:
  push:
    branches: [ satsujinki-mod ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: satsujinki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read CI flags
        run: |
          if [ -f ci/flags.env ]; then cat ci/flags.env >> "$GITHUB_ENV"; fi

      - name: Build jar
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload jar artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: satsujinki-jar
          path: build/libs/*.jar

      - name: Server GameTests
        id: gametest
        if: steps.build.outcome == 'success' && env.RUN_GAMETEST == '1'
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 1500 ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log

      - name: Production server smoke test (release jar)
        id: prod
        if: steps.build.outcome == 'success' && env.RUN_PROD == '1'
        continue-on-error: true
        run: |
          chmod +x ci/prod-server-test.sh
          set -o pipefail
          timeout 900 bash ci/prod-server-test.sh 2>&1 | tee prod.log

      - name: Client autotest (screenshots)
        id: client
        if: steps.build.outcome == 'success' && env.RUN_CLIENT == '1'
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pautotest --console=plain 2>&1 | tee client.log

      - name: Publish results to ci-<branch>
        if: always()
        run: |
          mkdir -p out/screenshots
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }} prod=${{ steps.prod.outcome }} client=${{ steps.client.outcome }}" > out/STATUS
          cp build.log out/ 2>/dev/null || true
          cp prod.log prod-server.log out/ 2>/dev/null || true
          grep -E "error:|warning: \[removal\]|\.java:[0-9]+: (error|warning)" -A3 build.log > out/errors.txt 2>/dev/null || true
          tail -c 300000 gametest.log > out/gametest.log 2>/dev/null || true
          tail -c 400000 client.log > out/client.log 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/satsujinki_autotest/*.txt out/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cd out
          RESULT_BRANCH="ci-${GITHUB_REF_NAME}"
          git init -q -b "$RESULT_BRANCH"
          git config user.name "satsujinki-ci"
          git config user.email "satsujinki-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RESULT_BRANCH"
