name: HuntCraft Build

on:
  push:
    branches: [ huntcraft ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huntcraft-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: GameTest server
        id: gametest
        if: steps.build.outcome == 'success' && hashFiles('ci/run-gametest') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          timeout 1200 ./gradlew runGameTestServer 2>&1 | tee gametest.log

      - name: Client autotest (screenshots)
        id: client
        if: steps.build.outcome == 'success' && hashFiles('ci/run-client') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=4.5
          mkdir -p run
          cp ci/options.txt run/options.txt || true
          set -o pipefail
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PhcAutotest 2>&1 | tee client.log

      - name: Publish results to huntcraft-ci branch
        if: always()
        run: |
          mkdir -p out
          echo "${GITHUB_SHA}" > out/SOURCE_SHA
          echo "build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }} client=${{ steps.client.outcome }}" > out/STATUS
          cp build.log out/ 2>/dev/null || true
          grep -E "error:|\.java:[0-9]+: (error|warning)" -A3 build.log > out/errors.txt 2>/dev/null || true
          tail -c 200000 gametest.log > out/gametest.log 2>/dev/null || true
          tail -c 300000 client.log > out/client.log 2>/dev/null || true
          cp run/logs/latest.log out/run-latest.log 2>/dev/null || true
          cp run/logs/debug.log out/run-debug.log 2>/dev/null || true
          mkdir -p out/screenshots
          cp run/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp run/huntcraft_autotest/*.png out/screenshots/ 2>/dev/null || true
          cp run/huntcraft_autotest/*.txt out/ 2>/dev/null || true
          cp run/crash-reports/*.txt out/ 2>/dev/null || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          cd out
          git init -q -b huntcraft-ci
          git config user.name "huntcraft-ci"
          git config user.email "huntcraft-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI results for ${GITHUB_SHA} ($(cat STATUS))"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" huntcraft-ci
