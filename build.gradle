plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('hcAutotest')) {
                property 'huntcraft.autotest', 'true'
                jvmArgs '-Xmx3G'
            }
        }

        // Client run with Embeddium + Oculus and the HuntCraft shader pack (CI shader screenshots).
        // Mods come from configurations.hcShaderMods (deobfuscated by FG) copied into run-shaders/mods.
        clientShaders {
            parent minecraft.runs.client
            workingDirectory project.file('run-shaders')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'huntcraft.autotest.shaders', 'true'
            property 'huntcraft.autotest', 'false'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx3G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---------------------------------------------------------------------------------------------
// Shared resource files assembled from per-module fragments so modules never edit the same file:
//   src/main/lang/<lang>/*.json  -> assets/huntcraft/lang/<lang>.json
//   src/main/sounds/*.json       -> assets/huntcraft/sounds.json
// ---------------------------------------------------------------------------------------------
def hcGenerated = layout.buildDirectory.dir('generated/hcmerged')
tasks.register('mergeFragments') {
    inputs.dir('src/main/lang').optional()
    inputs.dir('src/main/sounds').optional()
    outputs.dir(hcGenerated)
    doLast {
        def outDir = hcGenerated.get().asFile
        def slurper = new groovy.json.JsonSlurper()
        def langRoot = file('src/main/lang')
        if (langRoot.exists()) {
            langRoot.eachDir { langDir ->
                def merged = new TreeMap()
                langDir.listFiles().findAll { it.name.endsWith('.json') }.sort { it.name }.each { f ->
                    merged.putAll(slurper.parse(f, 'UTF-8'))
                }
                def target = new File(outDir, "assets/${mod_id}/lang/${langDir.name}.json")
                target.parentFile.mkdirs()
                target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
            }
        }
        def soundRoot = file('src/main/sounds')
        if (soundRoot.exists()) {
            def merged = new TreeMap()
            soundRoot.listFiles().findAll { it.name.endsWith('.json') }.sort { it.name }.each { f ->
                merged.putAll(slurper.parse(f, 'UTF-8'))
            }
            def target = new File(outDir, "assets/${mod_id}/sounds.json")
            target.parentFile.mkdirs()
            target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)), 'UTF-8')
        }
    }
}
sourceSets.main.resources.srcDir(hcGenerated)
tasks.named('processResources').configure { dependsOn 'mergeFragments' }

// ---------------------------------------------------------------------------------------------
// HuntCraft Shaders (src/main/shaderpack) -> HuntCraftShaders.zip at the jar resource root
// (auto-installed into shaderpacks/ by com.huntcraft.client.atmosphere.ShaderPackInstaller)
// and copied to build/shaderpack/HuntCraftShaders.zip as a separate artifact.
// ---------------------------------------------------------------------------------------------
def hcShaderPackDir = layout.buildDirectory.dir('generated/hcshaderpack')
tasks.register('shaderPackZip', Zip) {
    from 'src/main/shaderpack'
    archiveFileName = 'HuntCraftShaders.zip'
    destinationDirectory = hcShaderPackDir
    includeEmptyDirs = false
}
sourceSets.main.resources.srcDir(hcShaderPackDir)
tasks.named('processResources').configure { dependsOn 'shaderPackZip' }
tasks.register('shaderPackArtifact', Copy) {
    dependsOn 'shaderPackZip'
    from hcShaderPackDir
    into layout.buildDirectory.dir('shaderpack')
}
tasks.named('build').configure { dependsOn 'shaderPackArtifact' }

repositories {
    // only used by the shader test run (Embeddium + Oculus), resolved by prepareShaderRun / runClientShaders
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    hcShaderMods {
        transitive = false
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // shader test run only (not on the normal classpath), via CurseMaven (project id / file id):
    //   Embeddium 0.3.31+mc1.20.1 (CF 908741 / 5681725, Modrinth version UTbfe5d1)
    //   Oculus    1.20.1-1.8.0    (CF 581495 / 6020952, Modrinth version iQ1SwGc3)
    hcShaderMods fg.deobf('curse.maven:embeddium-908741:5681725')
    hcShaderMods fg.deobf('curse.maven:oculus-581495:6020952')
}

tasks.register('prepareShaderRun', Copy) {
    description = 'Copies Embeddium + Oculus (deobf) into run-shaders/mods for runClientShaders'
    from configurations.hcShaderMods
    into 'run-shaders/mods'
}
tasks.matching { it.name == 'runClientShaders' }.configureEach {
    dependsOn 'prepareShaderRun', 'createSrgToMcp'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '3000']
}
