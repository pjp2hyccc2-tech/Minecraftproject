# HitoriShaders - item ids (heldItemId = main hand, heldItemId2 = off hand,
# currentRenderedItemId), see lib/playerlight.glsl. Every light works in either hand.

# the phone: its screen glows a little (the camera app, the messages)
item.10001=hitori:phone
# the phone with its flashlight on (the mod swaps the item): a weak, wide, cool LED cone, dust in it
item.10002=hitori:phone_light
# the lighter: a small warm flame that never holds still
item.10003=hitori:lighter
# the laptop, open: its screen's cold glow on the closet's walls, the fusuma, the futon
item.10004=hitori:laptop
# the kitchen knife: no light - the blade catches the TV's
item.10005=hitori:knife

# vanilla hand-held lights (a simple warm point light)
item.10010=minecraft:torch minecraft:soul_torch minecraft:redstone_torch minecraft:lantern minecraft:soul_lantern \
 minecraft:glowstone minecraft:sea_lantern minecraft:shroomlight minecraft:jack_o_lantern minecraft:end_rod \
 minecraft:campfire minecraft:soul_campfire minecraft:lava_bucket minecraft:magma_block \
 minecraft:ochre_froglight minecraft:verdant_froglight minecraft:pearlescent_froglight
