# HitoriShaders - block ids (mc_Entity.x / blockEntityId), see lib/materials.glsl and lib/emitters.glsl
# Block ids and states as in docs/DESIGN.md section 7. A lamp is only a lamp while it is lit.
# EVERY BLOCK STATE MATCHES ONE ID ONLY: Oculus 1.7.0 does not resolve overlapping lines in file
# order (its id map is walked in hash order - in the CI tour the lit TV took the line of the TV
# switched off): a block with a state-specific line names the other states explicitly elsewhere
# (the TV on=true:channel=N here, on=false with the dark glass; the lit lamps here, the unlit ones
# with their material ...). tools/shader/lint.py checks that no state matches two ids.

# ---- vanilla light sources -------------------------------------------------------------------
# flames: only the bright texels glow (torches, campfires, fire - the doll burning in the sink)
block.10001=minecraft:torch minecraft:wall_torch minecraft:soul_torch minecraft:soul_wall_torch \
 minecraft:redstone_torch:lit=true minecraft:redstone_wall_torch:lit=true \
 minecraft:fire minecraft:soul_fire minecraft:campfire:lit=true minecraft:soul_campfire:lit=true \
 minecraft:furnace:lit=true minecraft:smoker:lit=true minecraft:blast_furnace:lit=true

