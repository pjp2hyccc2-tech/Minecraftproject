# the world's two-sided walls (a wall between two different rooms, or a room and the outside):
# id = 12100 + facing * 64 + inner * 8 + outer (facing: north east south west; faces in the
# order of the world's Props.Face: plaster_wall plaster_wall_stained wallpaper_old wood_wainscot
# bath_tile_wall oshiire_floor apartment_siding concrete). The face toward FACING shows the inner
