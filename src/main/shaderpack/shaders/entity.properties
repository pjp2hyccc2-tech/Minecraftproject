# HitoriShaders - entity ids (entityId), see lib/materials.glsl
# The spirits render translucent (the renderer's alpha = what the naked eye sees, 1.0 in the
# finder): pale rim, slowly dissolving edges, a slight waver, a colour split, a heat haze where
# they stand even when the eye sees nothing; in the finder a cold white-blue glow with a short
# afterimage. Their eyes layers (RenderType.eyes): the chef's embers, the visor glint.
entity.20001=hitori:visitor
entity.20002=hitori:waitress
entity.20003=hitori:chef
entity.20004=hitori:child
entity.20005=hitori:mirror_woman
entity.20006=hitori:manager
# the medium - a living person: no spirit look
entity.20010=hitori:medium
# her old kei car, wet: glossy paint
entity.20011=hitori:medium_car

entity.20020=minecraft:lightning_bolt
