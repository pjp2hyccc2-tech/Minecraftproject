# HitoriShaders - entity ids (entityId), see lib/materials.glsl
# the oni: the soaked plush rabbit. Lit only by what lights it (the TV, the phone's LED) - never
# visible in the dark by itself; a dull wet sheen; its button eyes (eyes layer) catch light, and
# burn white in a camera's IR. On a feed the shader glitches while it is on the picture.
entity.30001=hitori:oni_doll
# the woman: rendered only to cameras by the mod; on the IR feed a faint flat glow, the air
# wavering round her, the feed tearing while she is on it
entity.30002=hitori:woman
# a fixed camera: its red REC LED (eyes layer) blinks once a second
entity.30003=hitori:camera

entity.30020=minecraft:lightning_bolt
