# =====================================================================================
#  SounanShaders  SOUNAN (sounan) shader pack   (Oculus / Iris / OptiFine shader pack)
#  Lost on a mountain at night: cold blue-grey darkness under a dense cedar canopy, moonlight
#  shafts in drifting ground fog, and the beam of your flashlight - the only warm thing.
#  In sounan:kaerazu the mod drives rainStrength = fear and thunderStrength = danger
#  (docs/DESIGN.md section 8); everywhere else the pack is a quiet, moody, playable look.
# =====================================================================================

# ---- rendering toggles ---------------------------------------------------------------
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fast
separateAo=true
frustum.culling=true

# ---- shadow pass ---------------------------------------------------------------------
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

# ---- opaque programs write albedo / normal for the deferred hand lights: never blend them
blend.gbuffers_terrain.colortex5=off
blend.gbuffers_terrain.colortex6=off
blend.gbuffers_block.colortex5=off
blend.gbuffers_block.colortex6=off
blend.gbuffers_entities.colortex5=off
blend.gbuffers_entities.colortex6=off
blend.gbuffers_hand.colortex5=off
blend.gbuffers_hand.colortex6=off
# ---- translucents overwrite the aux buffer (colortex1) instead of blending into it -----
blend.gbuffers_water.colortex1=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_clouds.colortex1=off

# ---- alpha tests (faint sky objects, glass and eyes must not be cut away) --------------
alphaTest.gbuffers_skybasic=GREATER 0.002
alphaTest.gbuffers_skytextured=GREATER 0.002
alphaTest.gbuffers_clouds=GREATER 0.002
alphaTest.gbuffers_weather=GREATER 0.002
alphaTest.gbuffers_water=GREATER 0.002
alphaTest.gbuffers_spidereyes=GREATER 0.002
alphaTest.gbuffers_beaconbeam=GREATER 0.002

# ---- quality profiles (MEDIUM = the defaults: 60 fps on a mid-range GPU at 1080p) -------
profile.LOW=shadowMapResolution=1024 shadowDistance=32.0 SHADOW_FILTER=1 !VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=6 !FOG_NOISE BEAM_SAMPLES=4 !BEAM_SHADOWS !DUST_MOTES
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=48.0 SHADOW_FILTER=2 VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=10 FOG_NOISE BEAM_SAMPLES=8 BEAM_SHADOWS DUST_MOTES
profile.HIGH=shadowMapResolution=3072 shadowDistance=64.0 SHADOW_FILTER=3 VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=16 FOG_NOISE BEAM_SAMPLES=12 BEAM_SHADOWS DUST_MOTES
profile.ULTRA=shadowMapResolution=4096 shadowDistance=80.0 SHADOW_FILTER=3 VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=24 FOG_NOISE BEAM_SAMPLES=16 BEAM_SHADOWS DUST_MOTES

# ---- options screens -----------------------------------------------------------------
screen=<profile> FLASH_REDUCTION BRIGHTNESS <empty> [FLASHLIGHT] [ATMOSPHERE] [FEAR] [LIGHTING] [POST]
screen.FLASHLIGHT=BEAM_STRENGTH BEAM_FOG BEAM_SAMPLES BEAM_SHADOWS LENS_COOKIE DUST_MOTES
screen.ATMOSPHERE=FOG_DENSITY FOG_NOISE VOLUMETRIC_FOG VOLUMETRIC_SAMPLES
screen.FEAR=FEAR_EFFECTS PAREIDOLIA
screen.LIGHTING=SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER WAVING_PLANTS
screen.POST=FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH

sliders=BRIGHTNESS FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH FEAR_EFFECTS FOG_DENSITY VOLUMETRIC_SAMPLES BEAM_STRENGTH BEAM_FOG BEAM_SAMPLES shadowMapResolution shadowDistance SHADOW_FILTER
