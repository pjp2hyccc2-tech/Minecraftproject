# =====================================================================================
#  HitoriShaders  HITORI (hitori) shader pack   (Oculus / Iris / OptiFine shader pack)
#  A family restaurant by a national road at night, just after rain. Dark inside: pools of
#  light from the green exit signs, the drink bar, the cake case, sodium orange through the
#  blinds, cold flickering tubes, glossy floors. Outside: the wet black lot mirroring the
#  pole sign, the vending machines and the street lamps, low mist, an overcast sky with an
#  orange town glow.
#  In hitori:hidamari the mod drives rainStrength = fear, thunderStrength = danger,
#  nightVision = the camera finder, blindness = the camera flash, darknessFactor = caught
#  (docs/DESIGN.md section 9); everywhere else the pack is a quiet, moody, playable look.
# =====================================================================================

# ---- rendering toggles ---------------------------------------------------------------
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fast
separateAo=true
frustum.culling=true

# ---- shadow pass ---------------------------------------------------------------------
# hitori:hidamari: the emitter map (every lamp, translucent ones too - the cake case);
# elsewhere: the sun / moon shadow map (water and glass are dropped in shadow.vsh)
shadowTerrain=true
shadowTranslucent=true
shadowEntities=false
shadowBlockEntities=false
shadowPlayer=false
blend.shadow=off
alphaTest.shadow=off

# ---- opaque programs write albedo / normal / light for deferred: never blend them ---------
blend.gbuffers_terrain.colortex5=off
blend.gbuffers_terrain.colortex6=off
blend.gbuffers_block.colortex5=off
blend.gbuffers_block.colortex6=off
blend.gbuffers_entities.colortex5=off
blend.gbuffers_entities.colortex6=off
blend.gbuffers_entities.colortex8=off
blend.gbuffers_hand.colortex5=off
blend.gbuffers_hand.colortex6=off
blend.gbuffers_hand.colortex8=off
# ---- translucent surfaces own their pixel for the reflections (material + normal) ----------
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex5=off
blend.gbuffers_water.colortex6=off
blend.gbuffers_block_translucent.colortex1=off
blend.gbuffers_block_translucent.colortex5=off
blend.gbuffers_block_translucent.colortex6=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_clouds.colortex1=off
# ---- the spirits: the mask (haze, colour split, afterimage) is written even when they are
#      invisible (alpha 0) - no alpha test, no blending of the mask
blend.gbuffers_entities_translucent.colortex8=off
alphaTest.gbuffers_entities_translucent=off

# ---- alpha tests (faint sky objects, glass and eyes must not be cut away) --------------
alphaTest.gbuffers_skybasic=GREATER 0.002
alphaTest.gbuffers_skytextured=GREATER 0.002
alphaTest.gbuffers_clouds=GREATER 0.002
alphaTest.gbuffers_weather=GREATER 0.002
alphaTest.gbuffers_water=GREATER 0.002
alphaTest.gbuffers_spidereyes=GREATER 0.002
alphaTest.gbuffers_beaconbeam=GREATER 0.002

# ---- quality profiles (MEDIUM = the defaults: 60 fps on a mid-range GPU at 1080p) -------
# the light table (hitori:hidamari): 128 x 128 columns + the frame's outdoor lamp list in
# row 0 right of it - it never needed a full-screen RGBA32F buffer (prepare / prepare1 now run
# on 256 x 128 texels; every reader uses texelFetch)
size.buffer.colortex7=256 128

profile.LOW=!REFLECTIONS SSR_STEPS=8 !LIGHT_SHADOWS !GLASS_DROPLETS !VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=6 !FOG_NOISE \
 BEAM_SAMPLES=4 !BEAM_SHADOWS !DUST_MOTES shadowMapResolution=1024 shadowDistance=32.0 SHADOW_FILTER=1
profile.MEDIUM=REFLECTIONS SSR_STEPS=14 LIGHT_SHADOWS GLASS_DROPLETS VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=10 FOG_NOISE \
 BEAM_SAMPLES=8 BEAM_SHADOWS DUST_MOTES shadowMapResolution=2048 shadowDistance=64.0 SHADOW_FILTER=2
profile.HIGH=REFLECTIONS SSR_STEPS=20 LIGHT_SHADOWS GLASS_DROPLETS VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=16 FOG_NOISE \
 BEAM_SAMPLES=12 BEAM_SHADOWS DUST_MOTES shadowMapResolution=3072 shadowDistance=80.0 SHADOW_FILTER=3
profile.ULTRA=REFLECTIONS SSR_STEPS=28 LIGHT_SHADOWS GLASS_DROPLETS VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=24 FOG_NOISE \
 BEAM_SAMPLES=16 BEAM_SHADOWS DUST_MOTES shadowMapResolution=4096 shadowDistance=96.0 SHADOW_FILTER=3

# ---- options screens -----------------------------------------------------------------
screen=<profile> FLASH_REDUCTION BRIGHTNESS <empty> [LIGHTS] [REFLECT] [SPIRITS] [FLASHLIGHT] [ATMOSPHERE] [FEAR] [POST] [SUN]
screen.LIGHTS=COLORED_LIGHT LIGHT_STRENGTH LIGHT_SHADOWS LIGHT_FLICKER
screen.REFLECT=REFLECTIONS SSR_STEPS WET_SURFACES GLASS_DROPLETS
screen.SPIRITS=SPIRIT_HAZE AFTERIMAGE
screen.FLASHLIGHT=BEAM_STRENGTH BEAM_FOG BEAM_SAMPLES BEAM_SHADOWS LENS_COOKIE DUST_MOTES
screen.ATMOSPHERE=FOG_DENSITY FOG_NOISE VOLUMETRIC_FOG VOLUMETRIC_SAMPLES
screen.FEAR=FEAR_EFFECTS PAREIDOLIA
screen.POST=FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH
screen.SUN=SHADOWS shadowMapResolution shadowDistance SHADOW_FILTER WAVING_PLANTS

sliders=BRIGHTNESS FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH FEAR_EFFECTS FOG_DENSITY VOLUMETRIC_SAMPLES \
 BEAM_STRENGTH BEAM_FOG BEAM_SAMPLES LIGHT_STRENGTH SSR_STEPS shadowMapResolution shadowDistance SHADOW_FILTER
