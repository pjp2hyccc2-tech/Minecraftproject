# =====================================================================================
#  MeikonShaders  MEIKON (meikon) shader pack   (Oculus / Iris / OptiFine shader pack)
#  Japanese folk-horror look: near-black cold darkness, warm flickering lanterns, a blood
#  red moon over the courtyard, dense crimson-black fog.
#  In meikon:kakuriyo the mod drives rainStrength = fear and thunderStrength = danger
#  (see docs/DESIGN.md section 6); everywhere else the pack is a quiet, eerie, foggy look.
# =====================================================================================

# ---- rendering toggles ---------------------------------------------------------------
oldLighting=false
oldHandLight=false
dynamicHandLight=true
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fast
separateAo=true
frustum.culling=true

# ---- shadow pass ---------------------------------------------------------------------
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

# ---- translucents overwrite the aux buffer (colortex1) instead of blending into it -----
blend.gbuffers_water.colortex1=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_clouds.colortex1=off

# ---- alpha tests (faint sky objects, rain and glass must not be cut away) --------------
alphaTest.gbuffers_skybasic=GREATER 0.002
alphaTest.gbuffers_skytextured=GREATER 0.002
alphaTest.gbuffers_clouds=GREATER 0.002
alphaTest.gbuffers_weather=GREATER 0.002
alphaTest.gbuffers_water=GREATER 0.002
alphaTest.gbuffers_spidereyes=GREATER 0.002
alphaTest.gbuffers_beaconbeam=GREATER 0.002

# ---- quality profiles ----------------------------------------------------------------
profile.LOW=shadowMapResolution=1024 SHADOW_FILTER=1 !VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=4
profile.MEDIUM=shadowMapResolution=1536 SHADOW_FILTER=2 VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=6
profile.HIGH=shadowMapResolution=2048 SHADOW_FILTER=3 VOLUMETRIC_FOG VOLUMETRIC_SAMPLES=12

# ---- options screens -----------------------------------------------------------------
screen=<profile> FLASH_REDUCTION BRIGHTNESS <empty> [POST] [ATMOSPHERE] [LIGHTING]
screen.POST=FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH
screen.ATMOSPHERE=FOG_DENSITY VOLUMETRIC_FOG VOLUMETRIC_SAMPLES
screen.LIGHTING=SHADOWS shadowMapResolution SHADOW_FILTER FLAME_FLICKER HAND_LANTERN_LIGHT WAVING_PLANTS

sliders=BRIGHTNESS FILM_GRAIN VIGNETTE CHROMATIC_ABERRATION BLOOM_STRENGTH FOG_DENSITY VOLUMETRIC_SAMPLES shadowMapResolution SHADOW_FILTER
