# =====================================================================================
#  HuntCraft Shaders 〜狩猟奇譚〜   (Iris / Oculus / OptiFine shader pack)
#  Cinematic look for HuntCraft: soft sun shadows, bloom on fire / lightning / monster glow,
#  volumetric light, height fog, per hunting-ground colour grading, waving plants, water SSR.
# =====================================================================================

# ---- rendering toggles ---------------------------------------------------------------
clouds=fast
sun=false
moon=false
vignette=false
underwaterOverlay=false
oldLighting=false
oldHandLight=false
dynamicHandLight=true
separateAo=true
particles.ordering=before
rain.depth=false
beacon.beam.depth=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true
frustum.culling=true
shadow.culling=true
backFace.solid=false
backFace.cutout=false
backFace.cutoutMipped=false
backFace.translucent=false

# ---- per-buffer blending -------------------------------------------------------------
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_spidereyes.colortex1=off
blend.gbuffers_spidereyes.colortex2=off

# ---- alpha tests ---------------------------------------------------------------------
alphaTest.gbuffers_skybasic=GREATER 0.0001
alphaTest.gbuffers_skytextured=GREATER 0.0001
alphaTest.gbuffers_water=GREATER 0.0001
alphaTest.gbuffers_spidereyes=GREATER 0.0001
alphaTest.gbuffers_clouds=GREATER 0.0001
alphaTest.gbuffers_weather=GREATER 0.0001
alphaTest.gbuffers_beaconbeam=GREATER 0.0001

# ---- profiles ------------------------------------------------------------------------
profile.LOW=shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SOFTNESS=0.75 !COLORED_SHADOWS !VOLUMETRIC_LIGHT !SSAO !WATER_REFLECTIONS SSR_STEPS=8 !HEIGHT_FOG !LABPBR
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SOFTNESS=1.0 COLORED_SHADOWS VOLUMETRIC_LIGHT VL_SAMPLES=8 SSAO WATER_REFLECTIONS SSR_STEPS=12 HEIGHT_FOG LABPBR
profile.HIGH=shadowMapResolution=2048 shadowDistance=160.0 SHADOW_SOFTNESS=1.0 COLORED_SHADOWS VOLUMETRIC_LIGHT VL_SAMPLES=12 SSAO WATER_REFLECTIONS SSR_STEPS=16 HEIGHT_FOG LABPBR
profile.CINEMATIC=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SOFTNESS=1.5 COLORED_SHADOWS VOLUMETRIC_LIGHT VL_SAMPLES=24 VL_STRENGTH=1.5 SSAO SSAO_STRENGTH=1.5 WATER_REFLECTIONS SSR_STEPS=32 HEIGHT_FOG LABPBR BLOOM_STRENGTH=1.25

# ---- options screens -----------------------------------------------------------------
screen=<profile> <empty> [SHADOW_SCREEN] [BLOOM_SCREEN] [ATMOSPHERE_SCREEN] [COLOR_SCREEN] [WORLD_SCREEN] [CAMERA_SCREEN]
screen.SHADOW_SCREEN=SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS COLORED_SHADOWS sunPathRotation SSAO SSAO_STRENGTH
screen.BLOOM_SCREEN=BLOOM BLOOM_STRENGTH EMISSIVE_BOOST
screen.ATMOSPHERE_SCREEN=VOLUMETRIC_LIGHT VL_SAMPLES VL_STRENGTH FOG_DENSITY HEIGHT_FOG WEATHER_HAZE HEAT_HAZE
screen.COLOR_SCREEN=COLOR_GRADING EXPOSURE SATURATION CONTRAST VIGNETTE VIGNETTE_STRENGTH NIGHT_BRIGHTNESS
screen.WORLD_SCREEN=WAVING_PLANTS WAVING_LEAVES WAVING_WATER WATER_WAVES WATER_REFLECTIONS SSR_STEPS DYNAMIC_HAND_LIGHT LABPBR
screen.CAMERA_SCREEN=MOTION_BLUR MOTION_BLUR_STRENGTH

sliders=shadowDistance SHADOW_SOFTNESS sunPathRotation SSAO_STRENGTH BLOOM_STRENGTH EMISSIVE_BOOST VL_SAMPLES VL_STRENGTH FOG_DENSITY EXPOSURE SATURATION CONTRAST VIGNETTE_STRENGTH NIGHT_BRIGHTNESS WATER_WAVES SSR_STEPS MOTION_BLUR_STRENGTH
