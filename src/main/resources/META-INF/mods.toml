modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="遭難 -SOUNAN-"
authors="${mod_authors}"
description='''
夜の帰らず山で遭難した。
手元には圏外のスマホと懐中電灯だけ。失くしたバッグを見つけ、山を抜けろ。
木の陰から覗くもの、背後を歩くもの、灯りを持って呼ぶもの――
近づいてはいけない。振り返ってはいけない。返事をしてはいけない。

A Japanese mountain survival horror. Lost at night with a dead phone and a flashlight: find your bag and get off the mountain alive.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
