[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="殺人喜 -SATSUJINKI- 【R18】"
authors="${mod_authors}"
logoFile="satsujinki_logo.png"
description='''
【R18／18歳未満の方はプレイできません】
あなたはデスゲームの主催者。集められた参加者たちを、巨大ミキサー・剣山プレス・回転ノコギリ・ギロチンで惨殺し、「喜」ポイントと殺戮ランクを稼ぎましょう。
過激な暴力・流血・残酷な表現を含みます。本作はフィクションであり、実在の人物・団体とは一切関係ありません。
'''

[[dependencies.${mod_id}]]
