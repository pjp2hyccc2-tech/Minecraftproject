modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="冥婚 -MEIKON-"
authors="${mod_authors}"
description='''
赤い封筒を拾ってしまった。
あなたは死者との婚礼に招かれた。屋敷に散らばる七つの鈴を集め、縁切りの鳥居で鳴らせ。
花嫁に見つかる前に。

A Japanese folk-horror game: gather the seven bells and sever the bond before the bride finds you.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
