modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="ひとりかくれんぼ -HITORI KAKURENBO-"
authors="${mod_authors}"
description='''
午前三時。木造アパートの203号室で、ひとりかくれんぼを始める。
米を詰め、爪を入れ、赤い糸で縫ったぬいぐるみ。「最初の鬼は、わたしだから」。
塩水を口に含んで押し入れに隠れ、仕掛けた定点カメラの映像を見る。――浴槽が、空になっている。

A first-person Japanese ritual horror: hitori kakurenbo, alone in apartment 203 at 3 a.m.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
