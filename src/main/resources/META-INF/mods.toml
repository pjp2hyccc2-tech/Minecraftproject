modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="霊撮 -REISATSU-"
authors="${mod_authors}"
description='''
国道沿いのファミリーレストラン「ひだまり」。閉店後に、閉めたはずの自動ドアが開き、誰もいない水道から水が流れ、
テーブルのメニューが床にばらまかれる――。
霊媒師から渡された古い写真機を手に、夜の店内へ。霊たちに気付かれずに、そのすべてを写真に収めろ。

A Japanese stealth photography horror. A family restaurant by a deadly curve is haunted after closing: photograph
every spirit without being noticed, and hand the evidence to the medium.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
